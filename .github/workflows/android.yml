name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and unit tests
        id: gradle
        run: |
          mkdir -p out
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease bundleRelease 2>&1 | tee out/build.log

      - name: Collect build outputs
        if: always()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Depter-1.0.${GITHUB_RUN_NUMBER}.apk" 2>/dev/null || true
          cp app/build/outputs/bundle/release/app-release.aab "out/Depter-1.0.${GITHUB_RUN_NUMBER}.aab" 2>/dev/null || true
          cp app/build/outputs/mapping/release/mapping.txt out/mapping.txt 2>/dev/null || true
          if [ -d app/build/test-results ]; then tar -czf out/unit-test-results.tgz -C app/build test-results; fi
          grep -E "^e: |error:|FAILED|BUILD (SUCCESSFUL|FAILED)" out/build.log | head -200 > out/build-errors.txt || true

      - name: Enable KVM
        if: steps.gradle.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator tests and screenshots
        if: steps.gradle.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci-emulator.sh

      - name: Publish to builds branch
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "{\"run\": ${GITHUB_RUN_NUMBER}, \"sha\": \"${GITHUB_SHA}\", \"build\": \"${{ steps.gradle.outcome }}\"}" > out/status.json
          cd out
          git init -q
          git config user.name "depter-ci"
          git config user.email "depter-ci@users.noreply.github.com"
          git checkout -q -b builds
          git add -A
          git commit -qm "Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7}): ${{ steps.gradle.outcome }}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" builds
